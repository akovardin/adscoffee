networks:
  production:
    hosts:
      - root@miniservices

commands:
  nginx:
    run: systemctl restart nginx

  docker-pull:
    run: docker pull registry.gitflic.ru/project/kovardin/adscoffee/platform-server:latest

  docker-stop:
    run: docker stop platform-server || true && docker rm platform-server || true

  docker-start:
    run: docker run -p 8091:8081 -d registry.gitflic.ru/project/kovardin/adscoffee/platform-server:latest serve -c=configs/prod.yaml