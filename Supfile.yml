networks:
  production:
    hosts:
      - root@188.68.222.18

commands:
  nginx:
    run: systemctl restart nginx

  docker-pull-server:
    run: docker pull registry.gitflic.ru/project/kovardin/adscoffee/platform-server:$SERVER_VERSION

  docker-stop-server:
    run: docker stop platform-server || true && docker rm platform-server || true

  docker-start-server:
    run: docker run -p 8071:8081 --network platform_default --name platform-server -d -v /opt/platform/server/configs:/configs registry.gitflic.ru/project/kovardin/adscoffee/platform-server:$SERVER_VERSION serve -c=/configs/prod.yaml


  docker-pull-admin:
    run: docker pull registry.gitflic.ru/project/kovardin/adscoffee/platform-admin:$ADMIN_VERSION

  docker-stop-admin:
    run: docker stop platform-admin || true && docker rm platform-admin || true

  docker-start-admin:
    run: docker run -p 8072:8082  --network platform_default --name platform-admin -d -v /opt/platform/admin/configs:/configs registry.gitflic.ru/project/kovardin/adscoffee/platform-admin:$ADMIN_VERSION serve -c=/configs/prod.yaml


  docker-pull-analytics:
    run: docker pull registry.gitflic.ru/project/kovardin/adscoffee/platform-analytics:$ANALYTICS_VERSION

  docker-stop-analytics:
    run: docker stop platform-analytics || true && docker rm platform-analytics || true

  docker-start-analytics:
    run: >
      docker run -p 8080:8080 --network platform_default --name platform-analytics -d -v /opt/platform/analytics/configs:/configs -e DAGU_AUTH_MODE=basic -e DAGU_AUTH_BASIC_USERNAME=admin -e DAGU_AUTH_BASIC_PASSWORD=$DAGU_AUTH_BASIC_PASSWORD registry.gitflic.ru/project/kovardin/adscoffee/platform-analytics:$ANALYTICS_VERSION


  letsencrypt:
    run: >
      letsencrypt certonly -a webroot --webroot-path=/var/www/platform.ads.coffee/web -d platform.ads.coffee
      letsencrypt certonly -a webroot --webroot-path=/var/www/admin.ads.coffee/web -d admin.ads.coffee