# https://taskfile.dev

version: '3'

dotenv: ['.env.prod']

vars:
  SERVER_VERSION: v0.6
  ADMIN_VERSION: v0.3
  ANALYTICS_VERSION: v0.4
  SERVER: miniservices
  NETWORK: production
  SERVICE_GROUP: adscoffee

tasks:  
  gitpush:
    cmds:
      - git push gitflic master
      - git push sourcecraft master
      - git push github master
      - git push gitverse master

  test:
    cmds:
      - go test -v ./...

  lint:
    cmds:
      - golangci-lint run ./...

  docker-up:
    cmds:
      - docker-compose -f dev-compose.yaml up -d

  docker-down:
    cmds:
      - docker-compose -f dev-compose.yaml down
  

  docker-build-server:
    cmds:
      - docker build -t registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-server:{{ .SERVER_VERSION }} -f ./server/Dockerfile .

  docker-publish-server:
    cmds:
      - docker push registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-server:{{ .SERVER_VERSION }}

  docker-run-server:
    cmds:
     - docker run --rm -p 8091:8081 -d -v /opt/platform/server/configs:/configs registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-server:{{ .SERVER_VERSION }} serve -c=configs/dev.yaml
  
  docker-build-admin:
    cmds:
      - docker build -t registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-admin:{{ .ADMIN_VERSION }} -f ./admin/Dockerfile .

  docker-publish-admin:
    cmds:
      - docker push registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-admin:{{ .ADMIN_VERSION }}

  docker-run-admin:
    cmds:
     - docker run --rm -p 8092:8082 -d -v /opt/platform/admin/configs:/configs registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-admin:{{ .ADMIN_VERSION }} serve -c=configs/dev.yaml


  docker-build-analytics:
    cmds:
      - docker build -t registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-analytics:{{ .ANALYTICS_VERSION }} -f ./analytics/Dockerfile .

  docker-publish-analytics:
    cmds:
      - docker push registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-analytics:{{ .ANALYTICS_VERSION }}

  docker-run-analytics:
    cmds:
     - docker run --rm -p 8080:8080 -d -v /Users/artem/projects/adscoffee/platform/analytics/configs:/configs -v /Users/artem/projects/adscoffee/platform/analytics/dagu:/var/lib/dagu registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-analytics:{{ .ANALYTICS_VERSION }}

  docker-serve-admin:
    cmds:
      - sup -e ADMIN_VERSION="{{ .ADMIN_VERSION }}" {{ .NETWORK }} docker-pull-admin
      - sup -e ADMIN_VERSION="{{ .ADMIN_VERSION }}" {{ .NETWORK }} docker-stop-admin
      - sup -e ADMIN_VERSION="{{ .ADMIN_VERSION }}" {{ .NETWORK }} docker-start-admin

  docker-serve-server:
    cmds:
      - sup -e SERVER_VERSION="{{ .SERVER_VERSION }}" {{ .NETWORK }} docker-pull-server
      - sup -e SERVER_VERSION="{{ .SERVER_VERSION }}" {{ .NETWORK }} docker-stop-server
      - sup -e SERVER_VERSION="{{ .SERVER_VERSION }}" {{ .NETWORK }} docker-start-server

  docker-serve-analytics:
    cmds:
      - sup -e ANALYTICS_VERSION="{{ .ANALYTICS_VERSION }}" {{ .NETWORK }} docker-pull-analytics
      - sup -e ANALYTICS_VERSION="{{ .ANALYTICS_VERSION }}" {{ .NETWORK }} docker-stop-analytics
      - sup -e ANALYTICS_VERSION="{{ .ANALYTICS_VERSION }}" -e DAGU_AUTH_BASIC_PASSWORD={{ .DAGU_AUTH_BASIC_PASSWORD }} {{ .NETWORK }} docker-start-analytics

  configs-server:
    cmds:
      - scp ./server/configs/prod.yaml {{ .SERVER }}:/opt/platform/server/configs/prod.yaml

  configs-admin:
    cmds:
      - scp ./admin/configs/prod.yaml {{ .SERVER }}:/opt/platform/admin/configs/prod.yaml

  configs-analytics:
    cmds:
      - scp ./analytics/configs/prod.yaml {{ .SERVER }}:/opt/platform/analytics/configs/prod.yaml


  deploy-server:
    cmds:
      - task: docker-build-server
      - task: docker-publish-server
      - task: docker-serve-server

  deploy-admin:
    cmds:
      - task: docker-build-admin
      - task: docker-publish-admin
      - task: docker-serve-admin

  deploy-analytics:
    cmds:
      - task: docker-build-analytics
      - task: docker-publish-analytics
      - task: docker-serve-analytics

  deploy:
    cmds:
      - task: deploy-server
      - task: deploy-admin
      - task: deploy-analytics

  serve:
    cmds:
      - scp ./deploy/nginx/admin.ads.coffee {{ .SERVER }}:/etc/nginx/sites-available/
      - scp ./deploy/nginx/platform.ads.coffee {{ .SERVER }}:/etc/nginx/sites-available/
      - sup {{ .NETWORK }} nginx

  letsencrypt:
    cmds:
      - sup {{ .NETWORK }} letsencrypt

  upload-compose:
    cmds:
      - ./services-compose.prod.yaml {{ .SERVER }}:/opt/platform/services-compose.yaml

  configs-clickhouse:
    cmds:
      - scp ./data/clickhouse/users-prod.xml {{ .SERVER }}:/opt/platform/clickhouse/users-prod.xml
      - scp ./data/clickhouse/initprod/* {{ .SERVER }}:/opt/platform/clickhouse/initprod/
