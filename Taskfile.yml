# https://taskfile.dev

version: '3'

dotenv: ['.env.prod', '.env.deploy']

vars:
  SERVER_VERSION: v0.7
  ADMIN_VERSION: v0.4
  ANALYTICS_VERSION: v0.5
  SUP: sup -sshconfig ~/.ssh/config
  SERVICE_GROUP: adscoffee

tasks:  
  gitpush:
    cmds:
      - git push gitflic master
      - git push sourcecraft master
      - git push github master
      - git push gitverse master

  test:
    cmds:
      - go test -v ./...

  lint:
    cmds:
      - golangci-lint run ./...

  docker-up:
    cmds:
      - docker-compose -f dev-compose.yaml up -d

  docker-down:
    cmds:
      - docker-compose -f dev-compose.yaml down

  # Обновляет файлы dist из исходников репозитория.
  # Конфиги сервисов (dist/{server,admin,analytics}/configs) являются источником
  # истины и этой командой НЕ перезаписываются.
  dist-update:
    desc: Обновить dist (redis-cluster, миграции ClickHouse, dagu dags, дашборды Grafana)
    cmds:
      - rm -rf dist/redis-cluster
      - cp -R docker/redis-cluster dist/redis-cluster

      - mkdir -p dist/clickhouse/init
      - rm -f dist/clickhouse/init/*.sql
      - cp data/clickhouse/initprod/*.sql dist/clickhouse/init/
      - sed -i.bak 's/platform-kafka-1:9092/kafka1:9092/g' dist/clickhouse/init/*.sql
      - rm -f dist/clickhouse/init/*.bak

      - mkdir -p dist/analytics/dagu/dags
      - cp analytics/dagu/dags/requests.yaml dist/analytics/dagu/dags/requests.yaml
      - cp analytics/dagu/dags/impressions.yaml dist/analytics/dagu/dags/impressions.yaml
      - cp analytics/dagu/dags/clicks.yaml dist/analytics/dagu/dags/clicks.yaml
      - cp analytics/dagu/dags/responses.yaml dist/analytics/dagu/dags/responses.yaml

      - mkdir -p dist/grafana/dashboards
      - cp docker/grafana/dashboards/*.json dist/grafana/dashboards/

  dist-upload:
    desc: Загрузить dist/ на хост ({{ .VENATOR }}:/opt/platform)
    cmds:
      - rsync -az --delete --exclude 'data/' --exclude '.env.dev' --exclude '.git/' ./dist/ {{ .VENATOR }}:/opt/platform/

  dist-prepare:
    desc: Создать и выставить права на data-каталоги на venator
    cmds:
      - '{{ .SUP }} venator dist-prepare'

  dist-up:
    desc: Запустить docker compose в /opt/platform на venator
    cmds:
      - '{{ .SUP }} venator dist-up'

  dist-ps:
    desc: Статус контейнеров на venator
    cmds:
      - '{{ .SUP }} venator dist-ps'

  dist-logs:
    desc: Логи контейнеров на venator
    cmds:
      - '{{ .SUP }} venator dist-logs'

  dist-down:
    desc: Остановить стек на venator
    cmds:
      - '{{ .SUP }} venator dist-down'

  dist-deploy:
    desc: Загрузить dist и запустить docker compose на venator
    cmds:
      - task: dist-upload
      - task: dist-prepare
      - task: dist-up
      - task: dist-ps

  server-deploy:
    desc: Собрать, запушить и обновить server на venator без остановки стека
    cmds:
      - task: docker-build-server
      - task: docker-publish-server
      - '{{ .SUP }} -e SERVER_VERSION="{{ .SERVER_VERSION }}" venator server-deploy'

  admin-deploy:
    desc: Собрать, запушить и обновить admin на venator без остановки стека
    cmds:
      - task: docker-build-admin
      - task: docker-publish-admin
      - '{{ .SUP }} -e ADMIN_VERSION="{{ .ADMIN_VERSION }}" venator admin-deploy'

  analytics-deploy:
    desc: Собрать, запушить и обновить analytics на venator без остановки стека
    cmds:
      - task: docker-build-analytics
      - task: docker-publish-analytics
      - '{{ .SUP }} -e ANALYTICS_VERSION="{{ .ANALYTICS_VERSION }}" venator analytics-deploy'

  nginx-install:
    desc: Установить nginx на venator (идемпотентно)
    cmds:
      - '{{ .SUP }} venator nginx-install'

  nginx-deploy:
    desc: Залить конфиги nginx (admin/platform/chui/kafka/analytics/grafana.ads.coffee) на venator и перезагрузить
    cmds:
      - scp ./deploy/nginx/admin.ads.coffee {{ .VENATOR }}:/etc/nginx/sites-available/admin.ads.coffee
      - scp ./deploy/nginx/platform.ads.coffee {{ .VENATOR }}:/etc/nginx/sites-available/platform.ads.coffee
      - scp ./deploy/nginx/chui.ads.coffee {{ .VENATOR }}:/etc/nginx/sites-available/chui.ads.coffee
      - scp ./deploy/nginx/kafka.ads.coffee {{ .VENATOR }}:/etc/nginx/sites-available/kafka.ads.coffee
      - scp ./deploy/nginx/analytics.ads.coffee {{ .VENATOR }}:/etc/nginx/sites-available/analytics.ads.coffee
      - scp ./deploy/nginx/grafana.ads.coffee {{ .VENATOR }}:/etc/nginx/sites-available/grafana.ads.coffee
      - '{{ .SUP }} venator nginx-reload'

  certbot-setup:
    desc: Установить certbot, hook на reload nginx и включить автопродление
    cmds:
      - '{{ .SUP }} venator certbot-install'

  certbot-renew-check:
    desc: Проверить автопродление сертификата (dry-run)
    cmds:
      - '{{ .SUP }} venator certbot-renew-check'


  docker-build-server:
    cmds:
      - docker build -t registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-server:{{ .SERVER_VERSION }} -f ./server/Dockerfile .

  docker-publish-server:
    cmds:
      - docker push registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-server:{{ .SERVER_VERSION }}

  docker-run-server:
    cmds:
     - docker run --rm -p 8091:8081 -d -v /opt/platform/server/configs:/configs registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-server:{{ .SERVER_VERSION }} serve -c=configs/dev.yaml
  
  docker-build-admin:
    cmds:
      - docker build -t registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-admin:{{ .ADMIN_VERSION }} -f ./admin/Dockerfile .

  docker-publish-admin:
    cmds:
      - docker push registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-admin:{{ .ADMIN_VERSION }}

  docker-run-admin:
    cmds:
     - docker run --rm -p 8092:8082 -d -v /opt/platform/admin/configs:/configs registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-admin:{{ .ADMIN_VERSION }} serve -c=configs/dev.yaml


  docker-build-analytics:
    cmds:
      - docker build -t registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-analytics:{{ .ANALYTICS_VERSION }} -f ./analytics/Dockerfile .

  docker-publish-analytics:
    cmds:
      - docker push registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-analytics:{{ .ANALYTICS_VERSION }}

  docker-run-analytics:
    cmds:
     - docker run --rm -p 8080:8080 -d -v /Users/artem/projects/adscoffee/platform/analytics/configs:/configs -v /Users/artem/projects/adscoffee/platform/analytics/dagu:/var/lib/dagu registry.gitflic.ru/project/kovardin/{{ .SERVICE_GROUP }}/platform-analytics:{{ .ANALYTICS_VERSION }}


