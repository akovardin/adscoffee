services:
  platform-redis:
    image: redis/redis-stack-server:latest
    # ports: 
    #   - 6379:6379

  platform-kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    # ports:
    #   - "19092:19092"
    #   - "19093:19093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      # Изменено: теперь только один узел выполняет роль и брокера, и контроллера
      KAFKA_PROCESS_ROLES: 'broker,controller'
      # Изменено: только один voter (сам себя)
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@platform-kafka:19093'
      KAFKA_LISTENERS: 'PLAINTEXT_INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:19093,PLAINTEXT_EXTERNAL://0.0.0.0:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_INTERNAL://platform-kafka:9092,PLAINTEXT_EXTERNAL://localhost:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT_INTERNAL'
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

  platform-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: platform-kafka:9092
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: password
    depends_on:
      - platform-kafka

