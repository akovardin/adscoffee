networks:
  # Хост задаётся SSH-алиасом `venator` (см. ~/.ssh/config); адрес сервера не хранится в git.
  venator:
    hosts:
      - venator

commands:
  glossary-mkdir:
    run: mkdir -p /var/www/ads.coffee/web/glossaries

  glossary-chmod:
    run: find /var/www/ads.coffee/web/glossaries -type d -exec chmod 755 {} + && find /var/www/ads.coffee/web/glossaries -type f -exec chmod 644 {} + && echo "glossaries updated"
