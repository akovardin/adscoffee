apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    uid: clickhouse
    isDefault: true
    jsonData:
      server: clickhouse
      port: 9000
      username: ${CLICKHOUSE_USER}
      database: ${CLICKHOUSE_DB}
      protocol: native
      tls: false
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}